schema_version: 1
tool_version: v2.3.0
tool_checksums_sha256: 639af50cddd7dbcc45561a067dd0f361abbddaf1ba5810c680b4fc5b0ba2c10b
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
  - module: .
    archive: .verification/mutation/bootstrap/root.zip
    ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
  - module: .
    mode: apidiff
    path: api/baseline.txt
operations:
- module: .
  gate: local-test
  steps:
  - type: go-test
    packages: ["./leaseservice"]
    run: '^TestAcquireRacingShutdownReleasesReservation$'
    race: true
    count: 1
    timeout: 2m
- module: .
  gate: test
  steps:
  - type: go-test
    packages: ["./..."]
    run: '^(TestContentionElectsExactlyOneOwner|TestAcquirePropagatesBackendAndCancellation|TestHandleLifecycleFailsClosed|TestHandleRejectsConcurrentOperationsWithoutBlockingState|TestHandleFailsClosedWhenDeadlinePassesDuringOperation|TestManagedRenewalReportsUncertaintyAndStopsAdmission|TestManagedStopHonorsCallerDeadline|TestStaleOwnerCannotAffectSuccessor|TestAcquireRacingShutdownReleasesReservation|TestManagerBoundsHandlesAndReleasesOnShutdown|TestWorkerCancelsOwnershipSensitiveJobOnLoss|TestCoordinatorCancelsOwnershipSensitiveTaskOnLoss)$'
    count: 25
    timeout: 20m
  - type: make
    makefile: verification/package.mk
    target: fence-mutations
    timeout: 20m
- module: .
  gate: docs
  steps:
  - type: make
    makefile: verification/package.mk
    target: docs
    timeout: 20m
- module: .
  gate: fuzz
  steps:
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzKeyParsing$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzPolicyBounds$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["./memory"]
    fuzz: '^FuzzLeaseStateModel$'
    budget: 10000x
    timeout: 2m
- module: .
  gate: benchmark
  steps:
  - type: go-test
    packages: ["./..."]
    benchmark: "."
    budget: 100ms
    timeout: 20m
